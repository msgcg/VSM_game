  <path d="M84 52 Q90 48 98 52" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="69" cy="58" rx="4" ry="2.5" fill="#0f172a"/>
  <circle cx="70" cy="57" r="1" fill="#ffffff"/>
  <ellipse cx="91" cy="58" rx="4" ry="2.5" fill="#0f172a"/>
