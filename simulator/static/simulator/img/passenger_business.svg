  <!-- Hair: Stylish dark businessman cut -->
  <path d="M54 52 Q60 30 84 28 Q108 30 106 50 Q106 40 96 35 Q78 33 62 42 Q54 48 54 52 Z" fill="#18181b"/>
  <path d="M52 54 Q50 66 54 72 Q57 60 56 52 Z" fill="#18181b"/>
