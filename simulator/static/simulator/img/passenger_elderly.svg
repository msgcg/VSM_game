      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#pbg_eld)" stroke="#34d399" stroke-width="2.5"/>

