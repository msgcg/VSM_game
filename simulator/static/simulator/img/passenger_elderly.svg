  <circle cx="92" cy="58" r="9" fill="rgba(255,255,255,0.25)" stroke="#fbbf24" stroke-width="2"/>
  <line x1="77" y1="58" x2="83" y2="58" stroke="#fbbf24" stroke-width="2"/>

  <!-- Eyes behind glasses -->
