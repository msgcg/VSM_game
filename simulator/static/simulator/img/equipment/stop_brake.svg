<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="sbBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sbLever" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fd033a"/>
      <stop offset="50%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="sbMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="sbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#fd033a" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Задняя монтажная пластина -->
  <rect x="25" y="15" width="70" height="90" rx="14" fill="url(#sbBody)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Предупреждающая черно-желтая полоса -->
  <g opacity="0.85">
    <rect x="28" y="18" width="64" height="8" rx="3" fill="#eab308"/>
    <path d="M35 18 L40 26 M48 18 L53 26 M61 18 L66 26 M74 18 L79 26 M87 18 L92 26" stroke="#000" stroke-width="2.5"/>
  </g>

  <!-- Надпись СТОП-КРАН -->
  <text x="60" y="36" fill="#f8fafc" font-size="7" font-weight="900" font-family="Montserrat, sans-serif" text-anchor="middle" letter-spacing="1">СТОП-КРАН</text>

  <!-- Металлическое основание шарнира -->
  <circle cx="60" cy="50" r="14" fill="url(#sbMetal)" stroke="#334155" stroke-width="2"/>
  <circle cx="60" cy="50" r="6" fill="#1e293b"/>

  <!-- Рукоятка крана (Рычаг) -->
  <g filter="url(#sbGlow)">
    <rect x="54" y="50" width="12" height="42" rx="6" fill="url(#sbLever)"/>
    <!-- Ребристая ручка захвата -->
    <rect x="48" y="76" width="24" height="24" rx="6" fill="#b91c1c" stroke="#fd033a" stroke-width="1.5"/>
    <line x1="51" y1="82" x2="69" y2="82" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <line x1="51" y1="88" x2="69" y2="88" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <line x1="51" y1="94" x2="69" y2="94" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Свинцовая пломба с проволокой -->
  <path d="M42 62 Q60 56 78 62" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
  <circle cx="60" cy="60" r="4" fill="#64748b" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="62" fill="#fff" font-size="3.5" font-weight="800" text-anchor="middle">ВСМ</text>
</svg>
