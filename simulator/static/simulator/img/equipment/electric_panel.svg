<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="epDoor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="epDisplay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="epGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00d2ff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Корпус щита с винтами по углам -->
  <rect x="20" y="14" width="80" height="92" rx="10" fill="url(#epDoor)" stroke="#64748b" stroke-width="2.5"/>
  <circle cx="26" cy="20" r="2" fill="#94a3b8"/>
  <circle cx="94" cy="20" r="2" fill="#94a3b8"/>
  <circle cx="26" cy="100" r="2" fill="#94a3b8"/>
  <circle cx="94" cy="100" r="2" fill="#94a3b8"/>

  <!-- Знак высокого напряжения (желтый треугольник) -->
  <polygon points="60,20 48,38 72,38" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
  <!-- Молния -->
  <path d="M60 24 L56 31 L61 31 L58 37 L65 29 L60 29 Z" fill="#000000"/>

  <!-- Цифровое табло параметров (напряжение 110В / СКНБ) -->
  <rect x="30" y="42" width="60" height="20" rx="4" fill="#090d16" stroke="rgba(0,210,255,0.4)" stroke-width="1.2" filter="url(#epGlow)"/>
  <text x="35" y="52" fill="#38bdf8" font-size="5" font-family="monospace" font-weight="700">СКНБ: НОРМА 27°C</text>
  <text x="35" y="58" fill="#22c55e" font-size="4.5" font-family="monospace" font-weight="700">СЕТЬ: ~220В / =110В</text>

  <!-- Индикаторные лампы -->
  <!-- 1. Лампа СКНБ (зеленая) -->
  <circle cx="36" cy="72" r="4" fill="#22c55e" stroke="#16a34a" stroke-width="1"/>
  <text x="36" y="81" fill="#cbd5e1" font-size="3.5" font-family="Montserrat" font-weight="700" text-anchor="middle">СКНБ</text>

  <!-- 2. Лампа ЗЕМЛЯ (красная сигнальная) -->
  <circle cx="60" cy="72" r="4" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
  <text x="60" y="81" fill="#cbd5e1" font-size="3.5" font-family="Montserrat" font-weight="700" text-anchor="middle">ЗЕМЛЯ</text>

  <!-- 3. Лампа КЛИМАТ (синяя) -->
  <circle cx="84" cy="72" r="4" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
  <text x="84" y="81" fill="#cbd5e1" font-size="3.5" font-family="Montserrat" font-weight="700" text-anchor="middle">КЛИМАТ</text>

  <!-- Тумблеры / Переключатели внизу -->
  <g fill="#475569">
    <rect x="32" y="88" width="8" height="12" rx="2"/>
    <circle cx="36" cy="91" r="2.5" fill="#f8fafc"/>
    <rect x="56" y="88" width="8" height="12" rx="2"/>
    <circle cx="60" cy="96" r="2.5" fill="#f8fafc"/>
    <rect x="80" y="88" width="8" height="12" rx="2"/>
    <circle cx="84" cy="91" r="2.5" fill="#f8fafc"/>
  </g>
</svg>
