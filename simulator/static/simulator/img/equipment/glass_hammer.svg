<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ghHandle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fd033a"/>
      <stop offset="50%" stop-color="#ff476f"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="ghSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="ghGlow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#fd033a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Настенный кронштейн-держатель -->
  <rect x="22" y="20" width="76" height="80" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="26" y="24" width="68" height="72" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(253,3,58,0.3)" stroke-width="1" stroke-dasharray="3,3"/>
  
  <text x="60" y="34" fill="#94a3b8" font-size="6.5" font-weight="800" font-family="Montserrat, sans-serif" text-anchor="middle" letter-spacing="0.5">ВЫБИТЬ СТЕКЛО</text>

  <!-- Сам молоток под углом 35 градусов -->
  <g transform="rotate(-30 60 60)" filter="url(#ghGlow)">
    <!-- Рукоятка молотка -->
    <rect x="55" y="32" width="10" height="58" rx="5" fill="url(#ghHandle)" stroke="#9f1239" stroke-width="1.2"/>
    <!-- Резиновые накладки для захвата -->
    <rect x="54" y="60" width="12" height="26" rx="3" fill="#1e293b" opacity="0.8"/>
    <line x1="54" y1="66" x2="66" y2="66" stroke="#475569" stroke-width="1"/>
    <line x1="54" y1="72" x2="66" y2="72" stroke="#475569" stroke-width="1"/>
    <line x1="54" y1="78" x2="66" y2="78" stroke="#475569" stroke-width="1"/>
    
    <!-- Головка молотка (сталь) -->
    <rect x="42" y="26" width="36" height="14" rx="3" fill="url(#ghSteel)" stroke="#475569" stroke-width="1"/>
    
    <!-- Заостренные конические бойки с двух сторон -->
    <polygon points="42,27 34,33 42,39" fill="url(#ghSteel)" stroke="#334155" stroke-width="1"/>
    <polygon points="78,27 86,33 78,39" fill="url(#ghSteel)" stroke="#334155" stroke-width="1"/>
    
    <!-- Центральное металлическое кольцо крепления -->
    <circle cx="60" cy="33" r="4" fill="#334155"/>
  </g>
</svg>
